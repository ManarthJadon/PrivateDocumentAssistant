name: tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docassistant
          POSTGRES_DB: docassistant_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U docassistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_USER: docassistant

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r pyproject.toml --group dev

      - name: Run tests
        run: .venv/bin/python -m pytest -v
[project]
name = "private-document-assistant"
version = "0.1.0"
description = "A fully local assistant that answers questions about your own documents, with sources."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "psycopg[binary]",
    "pgvector",
    "pypdf>=6.21.4,<7",  # 6.21.4 fixes 10 known security holes; 7.x is a bigger change, test it first,
    "python-docx",
    "httpx",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]